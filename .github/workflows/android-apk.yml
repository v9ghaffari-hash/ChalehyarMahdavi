name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify source, icons and configuration
        run: npm run verify

      - name: Prepare web application
        run: npm run prepare:web

      - name: Create a clean Android native project
        run: |
          rm -rf android
          npx cap add android

      - name: Install native Android save-file bridge
        run: node scripts/install-android-native.mjs

      - name: Generate Android launcher and splash assets
        run: npx @capacitor/assets generate --android

      - name: Sync Capacitor web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK and create checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/github-manager-debug.apk
          sha256sum artifacts/github-manager-debug.apk > artifacts/SHA256SUMS.txt
          file artifacts/github-manager-debug.apk
          cat artifacts/SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: github-manager-android-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
