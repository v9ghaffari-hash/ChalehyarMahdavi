name: Build QadamYar V47 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (without obsolete tools package)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify project structure
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          echo "Project structure OK"

      - name: Guard against the previous Compose alignment error
        run: |
          if grep -n "Alignment.TopLeft" app/src/main/java/ir/chillehyar/mahdi/MainActivity.kt; then
            echo "Unsupported Alignment.TopLeft found; use Alignment.TopStart."
            exit 1
          fi

      - name: Build APK
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QadamYar-V47-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
